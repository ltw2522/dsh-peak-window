<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Peak guard">
  <!-- 深色圆角底：与插件弹卡同色，便于在插件列表里辨识 -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#232323"/>
  <!-- 表盘：表示按时间窗判定的峰谷 -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#f2f2f2" stroke-width="3"/>
  <!-- 高亮扇形：峰时窗口（12 点方向到 3 点方向） -->
  <path d="M32 32 L32 19 A13 13 0 0 1 45 32 Z" fill="#f5a524"/>
  <!-- 指针 -->
  <path d="M32 32 L32 24" stroke="#f2f2f2" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M32 32 L37.6 36.8" stroke="#f2f2f2" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 提醒红点：峰时发送会被拦下确认 -->
  <circle cx="45" cy="45" r="4.2" fill="#e5484d"/>
</svg>
